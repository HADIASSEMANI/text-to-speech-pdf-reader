name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Pin GitHub-owned actions to full commit SHAs after verifying them online.
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9][0-9A-Za-z.+-]*$ ]] || { echo 'Invalid release version'; exit 1; }
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pyinstaller
      # The spec bundles this model; misaki[en] does not install it.
      - name: Install bundled English model
        run: python -m pip install --no-deps "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85"
      - name: Build application
        run: pyinstaller --noconfirm BookTTSReader.spec
      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $compiler) {
            $candidate = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
            if (-not (Test-Path $candidate)) {
              choco install innosetup -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
            }
            $compiler = Get-Command $candidate -ErrorAction Stop
          }
          & $compiler.Source "/DMyAppVersion=$env:APP_VERSION" "/O$env:GITHUB_WORKSPACE\installer-output" 'installer/BookTTSReader.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer-output/BookTTSReader-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    env:
      SIGNING_ENABLED: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9][0-9A-Za-z.+-]*$ ]] || { echo 'Invalid release version'; exit 1; }
          suffix=''
          if [[ "$SIGNING_ENABLED" != 'true' ]]; then suffix='-unsigned'; fi
          printf 'dmg_name=BookTTSReader-%s%s.dmg\n' "$version" "$suffix" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pyinstaller
      # The spec bundles this model; misaki[en] does not install it.
      - name: Install bundled English model
        run: python -m pip install --no-deps "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85"
      - name: Import Developer ID certificate
        if: env.SIGNING_ENABLED == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          test -n "$MACOS_CODESIGN_IDENTITY" || { echo 'Missing signing identity'; exit 1; }
          certificate_path="$RUNNER_TEMP/booktts-certificate.p12"
          keychain_path="$RUNNER_TEMP/booktts-signing.keychain-db"
          trap 'rm -f "$certificate_path"' EXIT
          umask 077
          python -c 'import base64, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "booktts-certificate.p12").write_bytes(base64.b64decode(os.environ["MACOS_CERTIFICATE_P12_BASE64"], validate=True))'
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -k "$keychain_path" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$keychain_path" > /dev/null
          security list-keychains -d user -s "$keychain_path"
      - name: Build application
        shell: bash
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_ENTITLEMENTS_FILE: packaging/macos/entitlements.plist
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$SIGNING_ENABLED" != 'true' ]]; then
            unset MACOS_CODESIGN_IDENTITY MACOS_ENTITLEMENTS_FILE
          fi
          pyinstaller --noconfirm BookTTSReader.spec
      - name: Verify application signature
        if: env.SIGNING_ENABLED == 'true'
        run: codesign --verify --deep --strict --verbose=2 "dist/Book TTS Reader.app"
      - name: Create disk image
        shell: bash
        env:
          DMG_NAME: ${{ steps.version.outputs.dmg_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/booktts-dmg" release-files
          ditto "dist/Book TTS Reader.app" "$RUNNER_TEMP/booktts-dmg/Book TTS Reader.app"
          ln -s /Applications "$RUNNER_TEMP/booktts-dmg/Applications"
          hdiutil create -volname 'Book TTS Reader' -srcfolder "$RUNNER_TEMP/booktts-dmg" -ov -format UDZO "release-files/$DMG_NAME"
      - name: Sign and notarize disk image
        if: env.SIGNING_ENABLED == 'true'
        shell: bash
        env:
          DMG_NAME: ${{ steps.version.outputs.dmg_name }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          test -n "$APPLE_ID" && test -n "$APPLE_TEAM_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" || { echo 'Missing notarization credentials'; exit 1; }
          codesign --force --sign "$MACOS_CODESIGN_IDENTITY" --timestamp "release-files/$DMG_NAME"
          codesign --verify --strict "release-files/$DMG_NAME"
          xcrun notarytool submit "release-files/$DMG_NAME" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple "release-files/$DMG_NAME"
          xcrun stapler validate "release-files/$DMG_NAME"
      - name: Delete temporary keychain
        if: always()
        shell: bash
        run: |
          keychain_path="$RUNNER_TEMP/booktts-signing.keychain-db"
          if [[ -f "$keychain_path" ]]; then
            security delete-keychain "$keychain_path"
          fi
          rm -f "$RUNNER_TEMP/booktts-certificate.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release-files/${{ steps.version.outputs.dmg_name }}
          if-no-files-found: error

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        working-directory: release-files
        run: |
          shopt -s nullglob
          files=(*.exe *.dmg)
          (( ${#files[@]} == 2 )) || { echo 'Expected a Windows installer and a macOS disk image'; exit 1; }
          sha256sum "${files[@]}" > SHA256SUMS.txt
      - name: Publish GitHub release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/*.exe release-files/*.dmg release-files/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --verify-tag --title "Book TTS Reader ${GITHUB_REF_NAME#v}" --generate-notes
